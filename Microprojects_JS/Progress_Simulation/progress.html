<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/output.css">
</head>

<body class="bg-gradient-to-r from-blue-500 via-purple-500 to-gray-600">
    <div class="max-w-md mx-auto mt-80 p-6 bg-gray-800 rounded-xl shadow-lg border border-gray-300">
    <div class="flex justify-between mb-2">
        <span class="text-sm font-semibold text-white">Downloading File...</span>
        <span id="progress-text" class="text-sm font-bold text-white">0%</span>
    </div>

    <!-- Progress Bar Background -->
    <div class="w-full bg-gray-200 rounded-full h-4 overflow-hidden shadow-inner">
        <!-- The Animated Progress Bar -->
        <div id="progress-bar" 
             class="h-full bg-blue-500 rounded-full transition-all duration-300 ease-out" 
             style="width: 0%">
        </div>
    </div>

    <button class="mt-6 w-full py-2 px-4 
    bg-blue-600 hover:bg-blue-700 text-white font-bold 
    rounded-lg transition-colors">Start Download</button>
    </div>
    <script src="./progress.js"></script>
</body>
</html>
